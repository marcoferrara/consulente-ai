    sinonimi: ["filtro gasolio", "fuel filter", "kraftstofffilter", "separatore acqua"]
  filtro_aria:
    percorso: "Luftversorgung > Luftfilter (Filtro aria)"
    sinonimi: ["filtro aria", "air filter", "luftfilter"]
  filtro_abitacolo:
    percorso: "Fahrerhaus > Heizung/Klima > Innenraumfilter (Filtro abitacolo)"
    sinonimi: ["filtro abitacolo", "cabin filter", "innenraumfilter", "pollenfilter"]
  alternatore:
    percorso: "Elektrische Anlage > Lichtmaschine (Alternatore)"
    sinonimi: ["alternatore", "alternator", "lichtmaschine", "generator"]
  motorino_avviamento:
