services:
  - type: web
    name: antiga-armonia-hub
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    disk:
      name: antiga-armonia-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PERSISTENT_DATA_DIR
        value: /data
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.9.18
